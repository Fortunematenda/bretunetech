# Staging site — place under /etc/nginx/sites-available/ and symlink to sites-enabled.
# Do NOT overwrite production vhosts. Obtain TLS with certbot after DNS points here.
#
# Auth: basic auth OR IP allowlist recommended before public DNS.
# Generate htpasswd:  htpasswd -c /etc/nginx/.htpasswd-staging operator

# --- Frontend: staging.bretunetech.com → 127.0.0.1:3015 ---
server {
    listen 80;
    listen [::]:80;
    server_name staging.bretunetech.com;

    # Temporary until certbot; keep this server for ACME only after HTTPS is live.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging.bretunetech.com;

    # ssl_certificate     /etc/letsencrypt/live/staging.bretunetech.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/staging.bretunetech.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # Discourage indexing
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    auth_basic "BretuneTech Staging";
    auth_basic_user_file /etc/nginx/.htpasswd-staging;

    location /robots.txt {
        default_type text/plain;
        return 200 "User-agent: *\nDisallow: /\n";
    }

    location / {
        proxy_pass http://127.0.0.1:3015;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- API: staging-api.bretunetech.com → 127.0.0.1:4005 ---
server {
    listen 80;
    listen [::]:80;
    server_name staging-api.bretunetech.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name staging-api.bretunetech.com;

    # ssl_certificate     /etc/letsencrypt/live/staging-api.bretunetech.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/staging-api.bretunetech.com/privkey.pem;
    # include /etc/letsencrypt/options-ssl-nginx.conf;
    # ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    # API uses JWT; optional basic auth in front (Playwright can use --ignore-https-errors
    # and HTTP credentials via extraHTTPHeaders if enabled).
    # auth_basic "BretuneTech Staging API";
    # auth_basic_user_file /etc/nginx/.htpasswd-staging;

    location / {
        proxy_pass http://127.0.0.1:4005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 25m;
    }
}
