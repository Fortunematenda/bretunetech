# Deploy never sets NEWSLETTER_SENDING_ENABLED or NEWSLETTER_WORKER_ENABLED.
# Bulk sending must remain off unless an operator enables it manually on the VPS.
name: BretuneTech Production Deployment

on:
  push:
    branches: [main, ci-rollback-test]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bretunetech-production
  cancel-in-progress: false

jobs:
  validate:
    name: Verify builds before deployment
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bretunetech_ci_migrate
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend dependencies, schema check, and build
        working-directory: backend
        env:
          # Fresh DBs cannot replay entire historical migrate order (legacy dependency skew).
          # CI proves the *current* schema applies; production deploy runs pending migrate deploy only.
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres?schema=public
        run: |
          npm ci --include=dev --no-audit --no-fund
          npx prisma validate
          node scripts/validate-migrations-local.js
          npm run build
          test -f dist/src/server.js
          if grep -q 'enable_newsletter_flags' ../scripts/deploy-production.sh; then
            echo 'deploy script must not auto-enable newsletter flags' >&2
            exit 1
          fi
          grep -q 'prisma migrate deploy' ../scripts/deploy-production.sh
      - name: Frontend dependencies and build
        working-directory: frontend
        run: |
          npm ci --include=dev --no-audit --no-fund
          npm run build
      - name: Newsletter Playwright
        working-directory: frontend
        env:
          NEWSLETTER_E2E: ${{ secrets.NEWSLETTER_E2E }}
          E2E_BASE_URL: ${{ secrets.E2E_BASE_URL }}
          E2E_ADMIN_EMAIL: ${{ secrets.E2E_ADMIN_EMAIL }}
          E2E_ADMIN_PASSWORD: ${{ secrets.E2E_ADMIN_PASSWORD }}
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
        run: |
          npx playwright install --with-deps chromium
          npm run test:newsletter-e2e

  deploy:
    name: Deploy with recovery
    needs: validate
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Update VPS and deploy
        uses: appleboy/ssh-action@v1.2.5
        env:
          FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: FORCE_DEPLOY
          command_timeout: 25m
          script: |
            set -eu
            cd /var/www/bretunetech
            export PATH=/opt/bretunetech-node/bin:$PATH
            test "$(node -v)" = "v22.23.5"
            node -e '
              const fs = require("node:fs");
              const env = require("node:util").parseEnv(
                fs.readFileSync("backend/.env","utf8")
              );
              for (const key of ["NEWSLETTER_SENDING_ENABLED","NEWSLETTER_WORKER_ENABLED"]) {
                if (env[key] !== "false") {
                  console.error("Deployment blocked: " + key + " must be false");
                  process.exit(1);
                }
              }
            '
            OLD=$(git rev-parse HEAD)
            git fetch origin main
            test "$(git rev-parse origin/main)" = "${{ github.sha }}"
            git merge --ff-only "${{ github.sha }}"
            bash scripts/deploy-production.sh "$OLD" "${FORCE_DEPLOY:-0}"
