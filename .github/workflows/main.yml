name: BretuneTech Production Deployment

on:
  push:
    branches:
      - main
      - ci-rollback-test
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bretunetech-production
  cancel-in-progress: false

jobs:
  validate:
    name: Verify builds before deployment
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Backend dependencies and build
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npx prisma generate
          npm run build
          test -f dist/src/server.js
      - name: Frontend dependencies and build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run build

  deploy:
    name: Deploy with recovery
    needs: validate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Update VPS and deploy
        uses: appleboy/ssh-action@v1.2.5
        env:
          FORCE_DEPLOY: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          envs: FORCE_DEPLOY
          command_timeout: 25m
          script: |
            set -eu
            cd /var/www/bretunetech
            OLD=$(git rev-parse HEAD)
            git fetch origin main
            git merge --ff-only origin/main
            bash scripts/deploy-production.sh "$OLD" "${FORCE_DEPLOY:-0}"
