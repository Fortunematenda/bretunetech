# BretuneTech Nginx Configuration
# Place at: /etc/nginx/sites-available/bretunetech
# Then: ln -s /etc/nginx/sites-available/bretunetech /etc/nginx/sites-enabled/
# Test: nginx -t && systemctl reload nginx
#
# Cert paths match typical Certbot output for bretunetech.com.
# If live paths differ, update ssl_certificate* only — keep redirect behaviour.

# ─── HTTP → HTTPS (apex, www, admin, api) ───────────────
server {
    listen 80;
    listen [::]:80;
    server_name bretunetech.com www.bretunetech.com admin.bretunetech.com api.bretunetech.com;

    # Certbot ACME challenges (uncomment if using webroot renewals)
    # location ^~ /.well-known/acme-challenge/ {
    #     root /var/www/certbot;
    # }

    return 301 https://$host$request_uri;
}

# ─── www → apex (HTTPS) ─────────────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.bretunetech.com;

    ssl_certificate     /etc/letsencrypt/live/bretunetech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bretunetech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    return 301 https://bretunetech.com$request_uri;
}

# ─── Main site + Admin (Next.js on port 3000) ───────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name bretunetech.com admin.bretunetech.com;

    ssl_certificate     /etc/letsencrypt/live/bretunetech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bretunetech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}

# ─── API (Express on port 4000) ─────────────────────────
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name api.bretunetech.com;

    # If API uses a separate Certbot name, point these to that live/ folder.
    ssl_certificate     /etc/letsencrypt/live/bretunetech.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bretunetech.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 20M;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
